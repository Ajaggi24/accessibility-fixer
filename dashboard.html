<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Accessibility Fixer — Results</title>
<style>
  body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #222; }
  h1 { font-size: 22px; }
  table { width: 100%; border-collapse: collapse; margin: 20px 0; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #ddd; }
  th { background: #f5f5f5; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
  .high { background: #d4edda; color: #155724; }
  .medium { background: #fff3cd; color: #856404; }
  .low { background: #f8d7da; color: #721c24; }
  #status { color: #888; font-style: italic; }
</style>
</head>
<body>
<h1>Accessibility Fixer — Results</h1>
<p id="status">Loading reports...</p>

<div id="summary"></div>
<div id="flagged"></div>

<script>
// Owner: Role 6 — Human QA & Demo Lead
// TODO: this loads reports/*.json via fetch, which requires serving this
// file over http:// (not file://). Use the same `python -m http.server`
// approach as the target site, pointed at the project root.

async function loadReports() {
  const status = document.getElementById('status');
  try {
    const [summary, fixes] = await Promise.all([
      fetch('reports/summary.json').then(r => r.json()),
      fetch('reports/fixes.json').then(r => r.json())
    ]);
    status.remove();
    renderSummary(summary);
    renderFlagged(fixes.filter(f => f.confidence === 'low'));
  } catch (err) {
    status.textContent = 'Could not load reports/ — run the pipeline first, then serve this folder over http.';
    console.error(err);
  }
}

function renderSummary(summary) {
  const el = document.getElementById('summary');
  let rows = summary.byCategory.map(r =>
    `<tr><td>${r.category}</td><td>${r.before}</td><td>${r.after}</td><td>${r.fixed}</td></tr>`
  ).join('');

  el.innerHTML = `
    <h2>Before / after (${summary.totalFixed} of ${summary.totalBefore} fixed)</h2>
    <table>
      <tr><th>Category</th><th>Before</th><th>After</th><th>Fixed</th></tr>
      ${rows}
    </table>
  `;
}

function renderFlagged(lowConfidenceFixes) {
  const el = document.getElementById('flagged');
  if (!lowConfidenceFixes.length) {
    el.innerHTML = '<p>No low-confidence fixes flagged.</p>';
    return;
  }

  let rows = lowConfidenceFixes.map(f => `
    <tr>
      <td>${f.rule}</td>
      <td><span class="badge low">low</span></td>
      <td>${f.reasoning}</td>
      <td><!-- TODO Role 6: add your review decision here --></td>
    </tr>
  `).join('');

  el.innerHTML = `
    <h2>Flagged for human review</h2>
    <table>
      <tr><th>Rule</th><th>Confidence</th><th>Agent's reasoning</th><th>Human decision</th></tr>
      ${rows}
    </table>
  `;
}

loadReports();
</script>
</body>
</html>
